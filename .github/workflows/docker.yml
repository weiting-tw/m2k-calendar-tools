# 自動發佈 Docker image：push 到 main 時，若 src/_version.py 的版號
# 在 Docker Hub 尚未存在，就 build 多平台 image 並推 :版號 + :latest。
# 版號沒動的 push 會自動跳過，避免重複發佈。
# 部署端由 NAS 上的 Watchtower 自動拉 :latest（見 docs/deploy-nas.md）。
name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: a26007565/m2k-calendar

jobs:
  # 閘門：測試沒過就不發佈 image。部署端是 Watchtower 自動拉 :latest，
  # 沒有這道閘門的話，未經測試的 commit 會直接進生產環境。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 使用者腳本離線測試（jsdom）
        run: |
          npm ci
          npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 行事曆離線單元測試
        # 只需 icalendar：caldav 是延遲載入的，純函式測試用不到（見 m2kcal._caldav）
        run: |
          python -m pip install --quiet icalendar
          python tests/test_m2k.py

      - name: healthcheck 腳本可執行（server 沒起來時要回 unhealthy）
        run: |
          if python src/healthcheck.py; then
            echo "::error::server 沒啟動卻回報 healthy" && exit 1
          fi

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from src/_version.py
        id: ver
        run: echo "version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/_version.py)" >> "$GITHUB_OUTPUT"

      - name: Check if tag already on Docker Hub
        id: check
        run: |
          if curl -fsS "https://hub.docker.com/v2/repositories/${IMAGE}/tags/${{ steps.ver.outputs.version }}" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${IMAGE}:${{ steps.ver.outputs.version }} 已存在，跳過發佈"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
