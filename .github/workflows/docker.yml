# 自動發佈 Docker image：push 到 main 時，若 src/_version.py 的版號
# 在 Docker Hub 尚未存在，就 build 多平台 image 並推 :版號 + :latest。
# 版號沒動的 push 會自動跳過，避免重複發佈。
# 部署端由 NAS 上的 Watchtower 自動拉 :latest（見 docs/deploy-nas.md）。
name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: a26007565/m2k-calendar

jobs:
  # 閘門：測試沒過就不發佈 image。部署端是 Watchtower 自動拉 :latest，
  # 沒有這道閘門的話，未經測試的 commit 會直接進生產環境。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 公司內部資訊掃描（信箱／部門代碼／組織樹路徑／內部主機）
        # 這個 repo 是公開的，而工具是對公司 webmail 寫的，很容易在註解或測試資料
        # 裡帶進真實資訊。放最前面：髒東西不該等測試跑完才發現。
        run: python tests/check_no_org_info.py

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: 使用者腳本離線測試（jsdom）
        run: |
          npm ci
          npm test

      - name: 安裝 Python 相依（與 Docker image 同一份 requirements.txt）
        run: python -m pip install --quiet -r requirements.txt

      - name: 行事曆離線單元測試
        run: python tests/test_m2k.py

      - name: MCP 煙霧測試（實際啟動 server；上游導到本機，免網路與帳密）
        # image 會裝 requirements 範圍內當下最新的 mcp，這裡擋住不相容的新版上 :latest
        run: python tests/smoke_mcp.py

      - name: healthcheck 腳本可執行（server 沒起來時要回 unhealthy）
        run: |
          if python src/healthcheck.py; then
            echo "::error::server 沒啟動卻回報 healthy" && exit 1
          fi

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version from src/_version.py
        id: ver
        run: echo "version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/_version.py)" >> "$GITHUB_OUTPUT"

      - name: Check if tag already on Docker Hub
        id: check
        run: |
          if curl -fsS "https://hub.docker.com/v2/repositories/${IMAGE}/tags/${{ steps.ver.outputs.version }}" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${IMAGE}:${{ steps.ver.outputs.version }} 已存在，跳過發佈"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: steps.check.outputs.exists == 'false'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
